<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>🎓 Portal</h2>
    <ul>
        <li class="active" onclick="showPage('home',this)">Dashboard</li>
        <li onclick="showPage('quiz',this)">Quiz</li>
        <li onclick="showPage('grades',this)">Grades</li>
        <li onclick="showPage('profile',this)">Profile</li>
    </ul>
</div>

<!-- Main -->
<div class="main">

<!-- DASHBOARD -->
<div id="home" class="page active">
    <h1>Welcome Back 👋</h1>

    <div class="cards">
        <div class="card"><h2>6</h2><p>Quizzes Done</p></div>
        <div class="card"><h2>82%</h2><p>Average Score</p></div>
        <div class="card"><h2>B+</h2><p>Grade</p></div>
    </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="page">
    <h1>Quiz</h1>

    <div class="quiz-box">
        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <h3 id="question"></h3>

        <div id="options" class="options"></div>

        <button onclick="nextQuestion()">Next</button>
    </div>

    <h2 id="score"></h2>
</div>

<!-- GRADES -->
<div id="grades" class="page">
    <h1>Grades</h1>

    <table>
        <tr><th>Subject</th><th>Score</th><th>Grade</th></tr>
        <tr><td>Math</td><td>92</td><td>A</td></tr>
        <tr><td>Physics</td><td>80</td><td>B+</td></tr>
        <tr><td>Chemistry</td><td>85</td><td>B+</td></tr>
    </table>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
    <h1>Profile</h1>

    <form class="profile-form">
        <input placeholder="Full Name">
        <input placeholder="Email">
        <input placeholder="Phone">
        <button type="button">Save</button>
    </form>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
