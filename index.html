<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>🎓 Portal</h2>
    <ul>
        <li onclick="showPage('home')">🏠 Dashboard</li>
        <li onclick="showPage('profile')">👤 Profile</li>
        <li onclick="showPage('quiz')">📝 Quiz</li>
        <li onclick="showPage('grades')">📊 Grades</li>
    </ul>
</div>

<!-- Main -->
<div class="main">

<!-- HOME -->
<div id="home" class="page active">
    <div class="hero">
        <h1>Welcome Back 👋</h1>
        <p>Your learning dashboard</p>
    </div>

    <div class="cards">
        <div class="card"><h2>5</h2><p>Quizzes</p></div>
        <div class="card"><h2>87%</h2><p>Average</p></div>
        <div class="card"><h2>A</h2><p>Grade</p></div>
    </div>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
    <h1>Profile</h1>
    <form class="profile-form">
        <input placeholder="Full Name">
        <input placeholder="Email">
        <input placeholder="Student ID">
        <input placeholder="Phone">
        <button type="button">Save</button>
    </form>
</div>

<!-- QUIZ -->
<div id="quiz" class="page">
    <h1>Math Quiz</h1>

    <div id="quizBox">
        <p id="question">What is 5 + 5?</p>

        <div class="options">
            <label><input type="radio" name="q" value="10"> 10</label>
            <label><input type="radio" name="q" value="9"> 9</label>
            <label><input type="radio" name="q" value="8"> 8</label>
        </div>

        <button onclick="checkAnswer()">Submit</button>
    </div>

    <h2 id="result"></h2>
</div>

<!-- GRADES -->
<div id="grades" class="page">
    <h1>Grades</h1>

    <table>
        <tr><th>Subject</th><th>Score</th><th>Grade</th></tr>
        <tr><td>Math</td><td>92</td><td>A</td></tr>
        <tr><td>Physics</td><td>78</td><td>B</td></tr>
        <tr><td>Chemistry</td><td>85</td><td>B+</td></tr>
    </table>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
